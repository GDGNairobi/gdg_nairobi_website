name: gdg-nairobi

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdg-nairobi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devfest_nairobi_cms
      POSTGRES_USER: devfest
      POSTGRES_PASSWORD: devfest_local
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - gdg_nairobi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devfest -d devfest_nairobi_cms']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  gdg_nairobi_postgres_data:
